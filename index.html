<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Martian Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; background: #000; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map', { crs: L.CRS.EPSG4326, center: [18, 77], zoom: 3 });

    // URL de tile de NASA Trek: verifícala en trek.nasa.gov/mars antes de usarla
    L.tileLayer('git remote -vhttps://trek.nasa.gov/tiles/Mars/EQ/Mars_MGS_MOLA_ClrShade_merge_global_463m/1.0.0/default/default028mm/{z}/{y}/{x}.jpg', {
      maxNativeZoom: 5, maxZoom: 8, attribution: 'NASA/JPL Trek'
    }).addTo(map);

    L.marker([18.4, 77.5]).addTo(map).bindPopup('Punto de interés');
  </script>
</body>
</html>
