<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marsgana Navigation Tool</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <div id="elev-box">Elevation: move the cursor over the map</div>

  <!-- Radar estilo Halo -->
  <div id="radar-box">
    <div id="radar">
      <div id="radar-sweep"></div>
      <div id="radar-blips"></div>
    </div>
    <label for="range">Range: <b id="range-label">100</b> km</label>
    <input type="range" id="range" min="10" max="500" step="10" value="100">
  </div>

  <!-- Panel de ruta y cercanos (colapsable) -->
  <div id="panel">
    <div id="panel-head">
      <strong>Route</strong>
      <button id="btn-collapse" title="Collapse panel">–</button>
    </div>
    <div id="panel-body">
      <button id="btn-route">Blaze a trail</button>
      <button id="btn-clear">Erase Trail</button>
      <button id="btn-start">Start = Trailblazer</button>
      <p id="route-info">Route: no waypoints</p>
      <p id="route-elev"></p>
      <h3>Nearby</h3>
      <ul id="nearby"></ul>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="nomenclatura.js"></script>
  <!-- calibracion.js se genera una vez con generarCalibracion() en la consola; si no existe, se usa la tabla de respaldo -->
  <script src="calibracion.js" onerror="console.warn('calibracion.js todavía no existe: se usa la tabla de respaldo')"></script>
  <!-- m20_waypoints.js = copia local del JSON de NASA (ver instrucciones); si no existe, se descarga de NASA -->
  <script src="m20_waypoints.js" onerror="console.warn('m20_waypoints.js no existe: se intentará descargar de NASA')"></script>
  <script src="app.js"></script>
</body>
</html>
